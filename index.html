<script>
/* ===== 🎨 مولد الشعار التلقائي — لا تحتاج ترفع صور ===== */
(function installJarresIcon(){
  function drawBell(size){
    const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');
    const bg=x.createLinearGradient(0,0,size,size);
    bg.addColorStop(0,'#f97316');bg.addColorStop(1,'#ea580c');
    x.fillStyle=bg;
    const r=size*0.22;
    x.beginPath();
    x.moveTo(r,0);
    x.arcTo(size,0,size,size,r);
    x.arcTo(size,size,0,size,r);
    x.arcTo(0,size,0,0,r);
    x.arcTo(0,0,size,0,r);
    x.closePath();
    x.fill();
    x.fillStyle='rgba(0,0,0,0.15)';
    x.beginPath();
    x.ellipse(size/2,size*0.82,size*0.28,size*0.04,0,0,Math.PI*2);
    x.fill();
    x.fillStyle='#ffffff';
    x.font=(size*0.58)+'px serif';
    x.textAlign='center';
    x.textBaseline='middle';
    x.shadowColor='rgba(0,0,0,0.3)';
    x.shadowBlur=size*0.02;
    x.shadowOffsetY=size*0.01;
    x.fillText('🔔',size/2,size*0.54);
    return c.toDataURL('image/png');
  }
  const sizes=[32,64,128,180,192,256,512];
  const icons={};
  sizes.forEach(s=>icons[s]=drawBell(s));
  const fav=document.getElementById('dyn-fav');if(fav)fav.href=icons[64];
  const ap1=document.getElementById('dyn-apple');if(ap1)ap1.href=icons[192];
  const ap2=document.getElementById('dyn-apple-180');if(ap2)ap2.href=icons[180];
  const ap3=document.getElementById('dyn-apple-192');if(ap3)ap3.href=icons[192];
  const ap4=document.getElementById('dyn-apple-512');if(ap4)ap4.href=icons[512];
  // تم حذف جزء Blob الخاص بالـ manifest من هنا لأنه يسبب المشكلة في الأندرويد
  window.jarresIconDataUrl=icons[192];
})();

const $ = id => document.getElementById(id);
// ... (ضع هنا باقي كود الجافاسكريبت الخاص بك تماماً كما هو، وظائف الطلبات، الصوت، MQTT، إلخ) ...

// ===== هذا هو التعديل الوحيد في الجافاسكريبت: استدعاء ملف Service Worker حقيقي =====
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
}
